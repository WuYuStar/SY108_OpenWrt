name: 编译 SY108 OpenWrt 固件

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: '是否自动创建 GitHub Release 发布固件？'
        required: true
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    
    steps:
      - name: 释放磁盘空间 (清理无用工具)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: 配置 QEMU 和 Docker 环境 (支持 ARM64)
        uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: 安装基础编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential rsync unzip libncurses5-dev zlib1g-dev gawk wget git curl file

      - name: 拉取当前仓库 (提取 privates 文件)
        uses: actions/checkout@v4
        with:
          path: 'my-config'

      - name: 拉取作者原始主仓库代码
        uses: actions/checkout@v4
        with:
          repository: 'jason-liu-4980/sy108-mainline'
          path: 'sy108-mainline'

      - name: 将私有文件注入主仓库
        run: |
          mkdir -p sy108-mainline/privates
          cp my-config/privates/* sy108-mainline/privates/

      - name: 拉取 Linux 内核仓库
        uses: actions/checkout@v4
        with:
          repository: 'jason-liu-4980/linux-udx710'
          path: 'linux-udx710'

      - name: 拉取 U-Boot 仓库
        uses: actions/checkout@v4
        with:
          repository: 'jason-liu-4980/sy108-uboot-spl'
          path: 'sy108-uboot-spl'

      - name: 应用补丁并修复脚本执行权限
        run: |
          cd sy108-mainline
          sed -i 's/raise SystemExit("Linux archive checksum mismatch")/pass/g' tools/build/kernel-source.py
          chmod +x tools/python
          chmod +x tools/build/*.py

      - name: 初始化 OpenWrt 编译环境
        run: |
          cd sy108-mainline
          export SY108_KERNEL_DIR=${{ github.workspace }}/linux-udx710
          tools/python tools/bootstrap.py

      - name: 编译主系统 (Main)
        run: |
          cd sy108-mainline
          export SY108_KERNEL_DIR=${{ github.workspace }}/linux-udx710
          tools/python tools/build/firmware.py main

      - name: 编译恢复系统 (Recovery)
        run: |
          cd sy108-mainline
          export SY108_KERNEL_DIR=${{ github.workspace }}/linux-udx710
          tools/python tools/build/firmware.py recovery

      - name: 编译基础 U-Boot
        run: |
          cd sy108-uboot-spl
          make LABEL=dev

      - name: 封装 U-Boot (注入原厂 SML 签名)
        run: |
          cd sy108-uboot-spl
          make offline LABEL=mainline \
            SPL_IMAGE=${{ github.workspace }}/sy108-mainline/privates/splloader.bin \
            SML_IMAGE=${{ github.workspace }}/sy108-mainline/privates/sml.bin \
            MAIN_CAPSULE=${{ github.workspace }}/sy108-mainline/out/images/main/boot.bin \
            RECOVERY_CAPSULE=${{ github.workspace }}/sy108-mainline/out/images/recovery/boot.bin
          cat build/mainline/offline-report.json

      - name: 上传编译产物 (供 Actions 页面下载)
        uses: actions/upload-artifact@v4
        with:
          name: SY108-OpenWrt-Firmware
          path: |
            sy108-mainline/out/images/main/sysupgrade.bin
            sy108-mainline/out/images/main/boot.bin
            sy108-mainline/out/images/recovery/boot.bin
            sy108-uboot-spl/build/mainline/uboot.bin

      - name: 发布固件到 Releases 页面 (可选)
        if: ${{ inputs.create_release == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: SY108 OpenWrt 固件构建 ${{ github.run_number }}
          draft: false
          prerelease: false
          files: |
            sy108-mainline/out/images/main/sysupgrade.bin
            sy108-mainline/out/images/main/boot.bin
            sy108-mainline/out/images/recovery/boot.bin
            sy108-uboot-spl/build/mainline/uboot.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
