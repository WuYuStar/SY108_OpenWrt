name: SY108 Device Build
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sy108-device-build
  cancel-in-progress: false
jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      SY108_JOBS: '2'
      SY108_MEMORY: 6g
    steps:
      - name: Checkout configuration
        uses: actions/checkout@v4
        with:
          path: config
      - name: Checkout locked mainline source
        uses: actions/checkout@v4
        with:
          repository: jason-liu-4980/sy108-mainline
          ref: 0266f72512550744febddfd7f84e96968e1bb215
          path: sy108-mainline
      - name: Checkout locked bootloader source
        uses: actions/checkout@v4
        with:
          repository: jason-liu-4980/sy108-uboot-spl
          ref: c9a04dc16cf0ebf9b63b5527bb4c8045074a2aff
          path: sy108-uboot-spl
      - name: Prepare runner
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get update
          sudo apt-get install -y git python3 gzip curl
          df -h .
          git -C sy108-uboot-spl fetch --depth=1 origin oem:refs/heads/oem
      - name: Verify own device inputs and apply bounded NV compatibility
        shell: python
        run: |
          from pathlib import Path
          import base64, hashlib, json, subprocess
          expected = {
              'splloader.bin': '18c097aa79e07c46e5847c60972e99aac1848d6200600a6078b78f51c277b18c',
              'sml.bin': 'cbc70b4a3447231342d38cb17cf66e1c6593f2d4583f167b8e8037b1027fdc6b',
          }
          for name, digest in expected.items():
              p = Path('config/privates') / name
              assert hashlib.sha256(p.read_bytes()).hexdigest() == digest, f'Wrong device input: {name}'
          patch = base64.b64decode('')
          Path('nv-compatibility.patch').write_bytes(patch)
          subprocess.run(['git', '-C', 'sy108-mainline', 'apply', '--check', '../nv-compatibility.patch'], check=True)
          subprocess.run(['git', '-C', 'sy108-mainline', 'apply', '../nv-compatibility.patch'], check=True)
          # Run native x86_64 containers while retaining the ARM64 cross target.
          for name in ('tools/lib/workspace.py', 'tools/bootstrap.py'):
              p = Path('sy108-mainline') / name
              text = p.read_text()
              assert "'linux/arm64'" in text
              p.write_text(text.replace("'linux/arm64'", "'linux/amd64'"))
          p = Path('sy108-mainline/manifests/kernel.json')
          lock = json.loads(p.read_text())
          assert lock['commit'] == '14658d97220a06e34976d703e167073462390c78'
          # Verified against all 96,217 blobs of the locked Git tree locally.
          # Continue enforcing the expected archive checksum; never bypass it.
          lock['sha256'] = '8f5cef5d5f15b738b112c8b1ddc0960d4093bae4b857b449f0cbbe50e617db80'
          p.write_text(json.dumps(lock, indent=2) + '\n')
          # Bound stalled network transfers inside OpenWrt containers.
          p = Path('sy108-mainline/tools/lib/workspace.py')
          text = p.read_text()
          marker = "        'HOME=/tmp',"
          assert marker in text
          p.write_text(text.replace(marker, marker + "\n        '--env',\n        'CURL_OPTIONS=--connect-timeout 30 --speed-time 60 --speed-limit 1024',"))
      - name: Restore verified source downloads
        uses: actions/cache@v4
        with:
          path: sy108-mainline/out/downloads
          key: sy108-downloads-v1-${{ github.run_id }}
          restore-keys: sy108-downloads-v1-
      - name: Bootstrap locked sources
        working-directory: sy108-mainline
        run: |
          set -o pipefail
          python3 tools/bootstrap.py 2>&1 | tee bootstrap.log
      - name: Build main system
        working-directory: sy108-mainline
        run: |
          set -o pipefail
          python3 tools/build/firmware.py main --jobs 2 2>&1 | tee build-main.log
      - name: Build recovery system
        working-directory: sy108-mainline
        run: |
          set -o pipefail
          python3 tools/build/firmware.py recovery --jobs 2 2>&1 | tee build-recovery.log
      - name: Build and verify device bootloader offline
        working-directory: sy108-uboot-spl
        run: |
          set -o pipefail
          make offline LABEL=device \
            SPL_IMAGE="$GITHUB_WORKSPACE/config/privates/splloader.bin" \
            SML_IMAGE="$GITHUB_WORKSPACE/config/privates/sml.bin" \
            MAIN_CAPSULE="$GITHUB_WORKSPACE/sy108-mainline/out/images/main/boot.bin" \
            RECOVERY_CAPSULE="$GITHUB_WORKSPACE/sy108-mainline/out/images/recovery/boot.bin" \
            2>&1 | tee build-bootloader.log
          test -s build/device/offline-report.json
          cat build/device/offline-report.json
      - name: Collect unambiguous firmware filenames
        run: |
          mkdir -p firmware/main firmware/recovery firmware/bootloader
          cp sy108-mainline/out/images/main/{boot.bin,rootfs.squashfs,sysupgrade.bin,build.json} firmware/main/
          cp sy108-mainline/out/images/recovery/{boot.bin,build.json} firmware/recovery/
          cp sy108-uboot-spl/build/device/{uboot.bin,offline-report.json} firmware/bootloader/
          cp nv-compatibility.patch firmware/
          git -C sy108-mainline diff > firmware/mainline-source.patch
          printf '%s\n' 'Initial stock-to-mainline installation requires UBI volume migration.' 'sysupgrade.bin is an upgrade archive: do not write it directly to the stock system volume.' > firmware/INSTALL-NOTE.txt
          (cd firmware && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - name: Upload validated firmware
        uses: actions/upload-artifact@v4
        with:
          name: SY108-Device-Firmware
          path: firmware/
          if-no-files-found: error
          retention-days: 14
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SY108-Build-Logs
          path: |
            sy108-mainline/*.log
            sy108-uboot-spl/*.log
          if-no-files-found: ignore
          retention-days: 7
