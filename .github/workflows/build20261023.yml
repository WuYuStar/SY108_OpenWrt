name: 编译 SY108 OpenWrt 固件20261023

on:
  workflow_dispatch:
    inputs:
      include_wifi:
        description: '是否注入 USB 无线网卡 (Wi-Fi) 驱动支持？'
        required: true
        type: boolean
        default: false
      create_release:
        description: '是否自动创建 GitHub Release 发布固件？'
        required: true
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    
    steps:
      - name: 01 - 释放磁盘空间 (清理无用工具)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: 02 - 配置 Python 3.11 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 03 - 配置 QEMU 和 Docker Buildx
        uses: docker/setup-qemu-action@v3
      
      - name: 04 - 配置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 05 - 安装基础编译依赖
        run: |
          echo "::group::安装系统依赖中..."
          sudo apt-get update
          sudo apt-get install -y build-essential rsync unzip libncurses5-dev zlib1g-dev gawk wget git curl file
          echo "::endgroup::"

      - name: 06 - 拉取当前仓库 (提取 privates 文件)
        uses: actions/checkout@v4
        with:
          path: 'my-config'

      - name: 07 - 拉取作者原始主仓库代码
        uses: actions/checkout@v4
        with:
          repository: 'jason-liu-4980/sy108-mainline'
          path: 'sy108-mainline'

      - name: 08 - 将私有文件注入主仓库并验证
        run: |
          echo "::group::注入 privates 文件"
          mkdir -p sy108-mainline/privates
          cp my-config/privates/* sy108-mainline/privates/
          ls -l sy108-mainline/privates/
          echo "::endgroup::"

      - name: 09 - 拉取 Linux 内核仓库
        uses: actions/checkout@v4
        with:
          repository: 'jason-liu-4980/linux-udx710'
          path: 'linux-udx710'

      - name: 10 - 拉取 U-Boot 仓库
        uses: actions/checkout@v4
        with:
          repository: 'jason-liu-4980/sy108-uboot-spl'
          path: 'sy108-uboot-spl'
          
      - name: 11 - 核心提速与定向裁剪 (去QEMU、砍Python、加USB网卡)
        run: |
          echo "::group::正在执行定向外科手术..."
          cd sy108-mainline
          
          # 1. 干掉内核校验报错
          sed -i 's/raise SystemExit("Linux archive checksum mismatch")/pass/g' tools/build/kernel-source.py
          
          # 2. 剥离 QEMU 模拟限制（修复跨行导致的删除失败）
          sed -i "/'--platform',/,+1d" tools/lib/workspace.py
          sed -i "s/os.environ.get('SY108_JOBS', '6')/os.environ.get('SY108_JOBS', '4')/g" tools/lib/workspace.py
          sed -i "s/'build', '--platform', 'linux\/arm64',/'build',/g" tools/bootstrap.py
          
          # 3. 主配置：砍掉无用包，并加上基础的 USB 有线网卡支持
          sed -i '/CONFIG_PACKAGE_python3=y/d' configs/openwrt-main.config
          sed -i '/CONFIG_PACKAGE_iperf3=y/d' configs/openwrt-main.config
          sed -i '/CONFIG_PACKAGE_htop=y/d' configs/openwrt-main.config
          
          cat >> configs/openwrt-main.config << 'EOF'
          CONFIG_PACKAGE_kmod-usb-net=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y
          CONFIG_PACKAGE_kmod-usb-net-rndis=y
          CONFIG_PACKAGE_kmod-usb-net-rtl8152=y
          CONFIG_PACKAGE_kmod-usb-net-asix=y
          CONFIG_PACKAGE_kmod-usb-net-asix-ax88179=y
          CONFIG_PACKAGE_usb-modeswitch=y
          CONFIG_CCACHE=y
          EOF
          
          # 4. 内核配置：去语音，强行开启 USB 网卡
          KERNEL_CFG=$(find ../linux-udx710/arch/arm64/configs -name "*defconfig" | head -n 1)
          if [ -n "$KERNEL_CFG" ]; then
              sed -i 's/CONFIG_SOUND=y/# CONFIG_SOUND is not set/g' "$KERNEL_CFG"
              sed -i 's/CONFIG_SND_USB_AUDIO=y/# CONFIG_SND_USB_AUDIO is not set/g' "$KERNEL_CFG"
              sed -i 's/# CONFIG_USB_USBNET is not set/CONFIG_USB_USBNET=y/g' "$KERNEL_CFG"
          fi
          
          chmod +x tools/python
          chmod +x tools/build/*.py
          echo "✅ 基础裁剪完成！"
          echo "::endgroup::"


      - name: 11.1 - (可选) 注入无线网卡驱动
        if: ${{ inputs.include_wifi == true }}
        run: |
          echo "::group::检测到选择无线网卡功能，正在强行注入 Wi-Fi 驱动..."
          cd sy108-mainline
          
          # 1. 注入 Wi-Fi 用户态软件包
          cat >> configs/openwrt-main.config << 'EOF'
          CONFIG_PACKAGE_wpad-openssl=y
          CONFIG_PACKAGE_iw=y
          CONFIG_PACKAGE_iwinfo=y
          CONFIG_PACKAGE_kmod-rtl8xxxu=y
          CONFIG_PACKAGE_kmod-rtl8188eu=y
          CONFIG_PACKAGE_kmod-rtl8812au-ct=y
          CONFIG_PACKAGE_kmod-rtl8821cu=y
          CONFIG_PACKAGE_kmod-rtw88=y
          CONFIG_PACKAGE_kmod-rtw88-usb=y
          EOF
          
          # 2. 修改内核：强行撕开 WLAN 框架
          KERNEL_CFG=$(find ../linux-udx710/arch/arm64/configs -name "*defconfig" | head -n 1)
          if [ -n "$KERNEL_CFG" ]; then
              sed -i 's/# CONFIG_WLAN is not set/CONFIG_WLAN=y/g' "$KERNEL_CFG"
              sed -i 's/# CONFIG_WIRELESS is not set/CONFIG_WIRELESS=y/g' "$KERNEL_CFG"
              sed -i 's/# CONFIG_CFG80211 is not set/CONFIG_CFG80211=y/g' "$KERNEL_CFG"
              sed -i 's/# CONFIG_MAC80211 is not set/CONFIG_MAC80211=y/g' "$KERNEL_CFG"
              
              echo "CONFIG_RTW88=m" >> "$KERNEL_CFG"
              echo "CONFIG_RTW88_USB=m" >> "$KERNEL_CFG"
              echo "CONFIG_RTL8XXXU=m" >> "$KERNEL_CFG"
          fi
          echo "✅ 无线网卡支持注入完毕！"
          echo "::endgroup::"

      - name: 11.5 - 尝试恢复编译缓存
        uses: actions/cache/restore@v4
        with:
          path: |
            sy108-mainline/out/downloads
            sy108-mainline/out/ccache
            sy108-mainline/out/openwrt-build/build_dir
            sy108-mainline/out/openwrt-build/staging_dir
          key: ${{ runner.os }}-openwrt-cache-v6
          restore-keys: |
            ${{ runner.os }}-openwrt-cache-

      - name: 12 - 初始化 OpenWrt 编译环境
        run: |
          echo "::group::初始化 OpenWrt 环境"
          cd sy108-mainline
          export SY108_KERNEL_DIR=${{ github.workspace }}/linux-udx710
          export SY108_JOBS=4
          export SY108_MEMORY=14g
          python3 tools/bootstrap.py
          echo "::endgroup::"

      - name: 13 - 编译主系统 (Main)
        run: |
          echo "::group::编译主系统开始 (原生交叉编译加速)"
          cd sy108-mainline
          export SY108_KERNEL_DIR=${{ github.workspace }}/linux-udx710
          export SY108_JOBS=4
          export SY108_MEMORY=14g
          python3 tools/build/firmware.py main
          echo "::endgroup::"

      - name: 14 - 编译恢复系统 (Recovery)
        run: |
          echo "::group::编译 Recovery 系统"
          cd sy108-mainline
          export SY108_KERNEL_DIR=${{ github.workspace }}/linux-udx710
          export SY108_JOBS=4
          export SY108_MEMORY=14g
          python3 tools/build/firmware.py recovery
          echo "::endgroup::"

      - name: 14.5 - 强制保存编译缓存 (即使超时也保存)
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            sy108-mainline/out/downloads
            sy108-mainline/out/ccache
            sy108-mainline/out/openwrt-build/build_dir
            sy108-mainline/out/openwrt-build/staging_dir
          key: ${{ runner.os }}-openwrt-cache-v6

      - name: 15 - 编译基础 U-Boot
        run: |
          echo "::group::编译 U-Boot"
          cd sy108-uboot-spl
          make LABEL=dev
          echo "::endgroup::"

      - name: 16 - 封装 U-Boot (注入原厂 SML 签名)
        run: |
          echo "::group::U-Boot 封装报告"
          cd sy108-uboot-spl
          make offline LABEL=mainline \
            SPL_IMAGE=${{ github.workspace }}/sy108-mainline/privates/splloader.bin \
            SML_IMAGE=${{ github.workspace }}/sy108-mainline/privates/sml.bin \
            MAIN_CAPSULE=${{ github.workspace }}/sy108-mainline/out/images/main/boot.bin \
            RECOVERY_CAPSULE=${{ github.workspace }}/sy108-mainline/out/images/recovery/boot.bin
          cat build/mainline/offline-report.json
          echo "::endgroup::"

      - name: 17 - 上传编译产物 (供 Actions 页面下载)
        uses: actions/upload-artifact@v4
        with:
          name: SY108-OpenWrt-Firmware
          path: |
            sy108-mainline/out/images/main/sysupgrade.bin
            sy108-mainline/out/images/main/boot.bin
            sy108-mainline/out/images/recovery/boot.bin
            sy108-uboot-spl/build/mainline/uboot.bin

      - name: 18 - 发布固件到 Releases 页面 (可选)
        if: ${{ inputs.create_release == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: SY108 OpenWrt 固件构建 ${{ github.run_number }}
          draft: false
          prerelease: false
          files: |
            sy108-mainline/out/images/main/sysupgrade.bin
            sy108-mainline/out/images/main/boot.bin
            sy108-mainline/out/images/recovery/boot.bin
            sy108-uboot-spl/build/mainline/uboot.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
